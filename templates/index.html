<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="EduGenie - Google Gemini powered learning assistant">
    <title>{{ app_name }}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body>
<main class="container">
    <header class="hero">
        <div>
            <p class="eyebrow">AI LEARNING ASSISTANT</p>
            <h1>EduGenie</h1>
            <p>Ask, understand, summarize, quiz yourself, and build a learning path.</p>
        </div>
        <span id="statusBadge" class="status">Ready</span>
    </header>

    <section class="card">
        <label for="task">Choose a task</label>
        <select id="task">
            <option value="qa">Ask a Question</option>
            <option value="explain">Explain a Concept</option>
            <option value="quiz">Generate Quiz</option>
            <option value="summarize">Summarize Text</option>
            <option value="learn">Learning Path</option>
        </select>

        <label id="levelLabel" for="level" class="hidden">Learner level</label>
        <select id="level" class="hidden">
            <option value="beginner">Beginner</option>
            <option value="intermediate">Intermediate</option>
            <option value="advanced">Advanced</option>
        </select>

        <label id="inputLabel" for="inputText">Your question</label>
        <textarea id="inputText" rows="10"
                  placeholder="Example: Which is the largest ocean?"></textarea>

        <button id="submitButton" type="button">Run EduGenie</button>
    </section>

    <section id="resultCard" class="card result-card hidden" aria-live="polite">
        <div class="result-header">
            <h2>Result</h2>
            <button id="copyButton" class="secondary" type="button">Copy</button>
        </div>
        <div id="result"></div>
    </section>

    <footer>
        <span>EduGenie • FastAPI + Google Gemini</span>
        <a href="/docs" target="_blank" rel="noreferrer">API docs</a>
    </footer>
</main>
<script src="{{ url_for('static', path='app.js') }}"></script>
</body>
</html>
